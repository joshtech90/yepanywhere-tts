<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Yep Anywhere</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#1a1a2e" />
    <style>
      /* Critical CSS to prevent flash of white background - only html, body/root handled by main CSS */
      html { background-color: #181818; }
      html[data-theme="verydark"] { background-color: #181818; }
      html[data-theme="light"] { background-color: #faf9f5; }
      html[data-theme="dark"] { background-color: #2f2f2f; }
      html[data-theme="auto"] { background-color: #2f2f2f; }
      html, body, #root { min-height: 100%; min-height: 100dvh; }
      body { margin: 0; background-color: inherit; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) { background-color: #faf9f5; }
        html[data-theme="auto"] { background-color: #faf9f5; }
      }
      /* Cockpit routes paint the Cockpit's own background from the start. */
      html[data-cockpit-theme="light"] { background-color: #f6f7fb; }
      html[data-cockpit-theme="dark"] { background-color: #10141d; }
    </style>
    <script>
      // Apply theme before page renders to prevent flash
      (() => {
        var stored = localStorage.getItem('yep-anywhere-theme');
        var theme = stored || 'auto';
        document.documentElement.setAttribute('data-theme', theme);
        // The start address and /cockpit open the Cockpit; paint its colours.
        var path = location.pathname;
        var cockpitTheme = 'auto';
        var saved = null;
        if (path !== '/' && path !== '/cockpit' && path.indexOf('/cockpit/') !== 0) return;
        try {
          saved = JSON.parse(localStorage.getItem('yep-anywhere-cockpit-appearance') || 'null');
        } catch (e) {}
        if (saved && (saved.theme === 'light' || saved.theme === 'dark')) cockpitTheme = saved.theme;
        if (cockpitTheme === 'auto') {
          cockpitTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-cockpit-theme', cockpitTheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
