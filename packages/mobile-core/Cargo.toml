[package]
name = "ya-mobile-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
[workspace]
[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
[features]
bindgen = ["uniffi/cli"]
[dependencies]
base64 = "=0.22.1"
hex = "=0.4.3"
libsodium-sys-stable = "=1.24.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
srp = { version = "=0.7.0-rc.3", default-features = false }
crypto-bigint = { version = "=0.7.6", features = ["zeroize"] }
thiserror = "=2.0.21"
uniffi = { version = "=0.32.2", features = ["tokio"] }
zeroize = "=1.8.2"
getrandom = "=0.3.4"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "=0.7.20"
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
futures-util = "=0.3.34"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "=0.7.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
url = "=2.5.8"
uuid = { version = "=1.23.0", features = ["v4"] }
flate2 = "=1.1.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
